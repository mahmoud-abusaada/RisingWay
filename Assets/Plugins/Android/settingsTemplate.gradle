// P1-04: new in Unity 6 / AGP 9. Repository declaration moved OUT of the per-project
// buildscript block and into settings-level dependencyResolutionManagement.
//
// This is why the old baseProjectTemplate.gradle had to go: it declared repositories
// (including the long-dead jcenter()) inside allprojects { buildscript { ... } }, which
// RepositoriesMode.PREFER_SETTINGS now ignores.
//
// The External Dependency Manager injects its resolved repositories into this file. Do not
// hand-edit the block it manages - run Assets > External Dependency Manager > Android Resolver
// > Resolve instead.

pluginManagement {
    repositories {
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher'
include ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        def unityProjectPath = $/file:///**DIR_UNITYPROJECT**/$.replace("\\", "/")
        maven {
            url (unityProjectPath + "/Assets/GeneratedLocalRepo/Firebase/m2repository") // Assets/Firebase/Editor/AnalyticsDependencies.xml:21, Assets/Firebase/Editor/AppDependencies.xml:25
        }
        maven {
            url "https://maven.google.com/" // Assets/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:7, Assets/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:12, Assets/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:17, Assets/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:22, Assets/GoogleMobileAds/Editor/GoogleUmpDependencies.xml:7, Assets/GooglePlayGames/com.google.play.games/Editor/GooglePlayGamesPluginDependencies.xml:9
        }
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
