// P1-04: rebuilt from the Unity 6000.5.7f1 default template.
//
// The previous version was structurally incompatible with AGP 9 and not worth patching:
//   - declared repositories here (google, jcenter, and six ad-network mavens). jcenter is dead,
//     and repository declaration has moved to settingsTemplate.gradle
//   - compileSdkVersion / minSdkVersion / targetSdkVersion  ->  compileSdk / minSdk / targetSdk
//   - aaptOptions -> androidResources, lintOptions -> lint, dexOptions removed entirely
//   - JavaVersion.VERSION_1_8 -> VERSION_17
//   - a hand-added dependency block pulling com.android.support:appcompat-v7:28.0.0 and
//     androidx.core:core:1.0.1. The support library cannot coexist with modern AGP, and
//     Jetifier - which used to translate it - no longer exists. Both are gone.
//
// The External Dependency Manager injects its resolved dependencies into the DEPS slot below.
// Do not hand-write them: run Assets > External Dependency Manager > Android Resolver > Resolve.
// EDM4U 1.2.179 predates this layout and may inject into the wrong place; updating it is P1-05.

apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
