# P1-04 / P1-05: rebuilt from the Unity 6000.5.7f1 default.
#
# Removed, and NOT to be reintroduced:
#   android.enableJetifier   - Jetifier translated com.android.support.* to AndroidX at build
#                              time. It is REMOVED in AGP 8+ and setting it is now an error.
#                              The support-library dependency it existed to translate has also
#                              been dropped from mainTemplate.gradle.
#                              NOTE: EDM4U re-injects this whenever
#                              GooglePlayServices.UseJetifier is True, so that is set to False
#                              in ProjectSettings/GvhProjectSettings.xml. Ticking the Jetifier
#                              checkbox in Android Resolver settings WILL break the build.
#   android.enableR8         - R8 is the only shrinker in modern AGP; the flag no longer exists
#                              and Unity stopped emitting the token.
#
# android.useAndroidX is deliberately absent: EDM4U writes it into its own managed block, and
# duplicating it here is pointless noise.

org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
