# P1-04: rebuilt from the Unity 6000.5.7f1 default.
#
# Removed:
#   android.enableJetifier=true   - Jetifier translated com.android.support.* to AndroidX at
#                                   build time. It is REMOVED in AGP 8+, and setting it now is
#                                   an error. The support-library dependency it existed to
#                                   translate has also been dropped from mainTemplate.gradle.
#   android.enableR8=...          - R8 is the only shrinker in modern AGP; the flag no longer
#                                   exists and Unity stopped emitting the token.
#
# Kept:
#   android.useAndroidX=true      - default in AGP 8+, but EDM4U still expects to see it and it
#                                   is harmless to state explicitly.

org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**
android.useAndroidX=true
**ADDITIONAL_PROPERTIES**
