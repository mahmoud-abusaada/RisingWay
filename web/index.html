<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rising Way</title>
<meta name="description" content="Rising Way: Space Ball Run - tap to turn and climb an endless neon track through space.">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: radial-gradient(ellipse at top, #1b1446 0%, #07061a 70%); color: #e8e6ff;
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 32px 16px; max-width: 560px; }
  h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: 1px;
       background: linear-gradient(90deg, #5cf2ff, #b36bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0 0 24px; color: #b9b5e6; }
  a.store { display: inline-block; margin: 6px; padding: 12px 22px; border-radius: 999px;
            background: linear-gradient(90deg, #2bd4ff, #8b5cff); color: #fff; text-decoration: none; font-weight: 600; }
  footer { margin-top: 32px; font-size: 14px; }
  footer a { color: #9c97d6; }
</style>
</head>
<body>
<main>
  <h1>Rising Way</h1>
  <p>Tap to turn. Climb an endless neon track through space and collect rare planets.</p>
  <a class="store" href="https://play.google.com/store/apps/details?id=com.abusaada.risingway">Get it on Google Play</a>
  <footer><a href="/privacy">Privacy policy</a></footer>
</main>
</body>
</html>
